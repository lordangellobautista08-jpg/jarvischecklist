<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>FRAME — Marvel Archive</title>
<style>
:root{--bg:#09090b;--line:#292930;--muted:#92929d;--text:#f4f4f5;--red:#e62429;--gold:#e7bd72}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#2a1014 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.wrap{max-width:1280px;margin:auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}
.brand{font-weight:850;letter-spacing:.16em;font-size:13px}.brand b{color:var(--red)}
.pill,.secondary{border:1px solid var(--line);background:#141418;border-radius:999px;padding:8px 14px;color:#d6d6dc;font-size:12px}
.primary{border:0;background:var(--red);color:#fff;font-weight:800;padding:11px 16px;border-radius:9px;width:100%}
.eyebrow{color:#f17c80;text-transform:uppercase;letter-spacing:.19em;font-size:10px;font-weight:800}
h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;letter-spacing:-.05em;margin:10px 0 8px}
.muted{color:var(--muted);font-size:13px}
.login{max-width:400px;margin:12vh auto;background:#17171d;border:1px solid #383840;border-radius:18px;padding:24px}
.field{width:100%;padding:11px 12px;background:#0d0d11;border:1px solid #34343c;border-radius:9px;color:#fff;margin:6px 0 12px}
label{font-size:10px;letter-spacing:.1em;color:var(--muted)}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.box{border:1px solid var(--line);background:linear-gradient(145deg,#17171d,#101014);border-radius:16px;padding:16px}
.big{font-size:30px;font-weight:800;letter-spacing:-.05em}
.track{height:6px;border-radius:99px;background:#303038;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,var(--red),#f06a6e);width:0;transition:width .25s}
.path{cursor:pointer;border-color:#4a3a2a}.path:hover{border-color:var(--gold)}.path h3{margin:0 0 4px;font-size:15px;color:var(--gold)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.toolbar input,.toolbar select{background:#131318;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;min-width:0}
.toolbar input{flex:1;min-width:180px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.layout.open{grid-template-columns:minmax(0,1fr) 330px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec h2{margin:0;font-size:15px;letter-spacing:.02em}.sec h2.mcu{color:var(--gold)}.sec span{color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.card{cursor:pointer;min-width:0;border-radius:12px;border:1px solid var(--line);background:#121216;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#56515a}.card.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.poster{aspect-ratio:2/3;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;background:linear-gradient(160deg,var(--c1),#0d0d12 85%);overflow:hidden}
.poster:before{content:"";position:absolute;width:120%;aspect-ratio:1;border:1px solid #ffffff2a;border-radius:50%;left:-30%;top:-22%;box-shadow:0 0 0 14px #ffffff08,0 0 0 30px #ffffff06}
.poster i{position:absolute;top:9px;left:10px;font-style:normal;font-size:8px;letter-spacing:.15em;color:#ffffffa0;font-weight:800;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster b{position:relative;font-size:13px;line-height:1;letter-spacing:-.03em;font-weight:900;text-shadow:0 2px 10px #0009;word-break:break-word}
.poster em{position:relative;font-style:normal;font-size:9px;color:#ffffffb0;margin-top:5px}
.done .poster:after{content:"✓";position:absolute;top:6px;right:8px;color:#9be4ba;font-size:14px;font-weight:900}
.done{border-color:#245b43}
.empty{color:var(--muted);text-align:center;padding:35px;border:1px dashed var(--line);border-radius:14px}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid #383840;background:#15151a;border-radius:16px;padding:16px}
aside .poster{aspect-ratio:16/10;border-radius:10px;margin-bottom:12px}aside .poster b{font-size:22px}
aside h3{margin:0 0 4px;font-size:19px;letter-spacing:-.03em;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11px;color:#c9c9d1}.chip.g{color:var(--gold);border-color:#4a3a2a}
.row{font-size:12px;color:var(--muted);margin:4px 0}.row span{color:#d6d6dc}
.syn{font-size:13px;color:#b5b5be;margin:12px 0}
.check{width:100%;border:1px solid #41414a;background:#1b1b21;color:#d8d8df;border-radius:9px;padding:10px;font-weight:750}
.check.done{border-color:#245b43;background:#13291f;color:#9be4ba}
.x{float:right;background:none;border:0;color:var(--muted);font-size:20px;line-height:1}
@media(max-width:900px){.dash{grid-template-columns:1fr}.layout.open{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:68vh;border-radius:18px 18px 0 0;z-index:20;box-shadow:0 -20px 60px #000c}}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:9px}.poster b{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">FRAME <b>/</b> MARVEL ARCHIVE</div><div id="who" hidden><button class="pill" id="out">Sign out</button></div></header>

<section id="login" class="login" hidden>
 <div class="eyebrow">Sign in</div><h1 style="font-size:30px">Your Marvel archive.</h1>
 <p class="muted">Enter your email and we’ll send a magic link. No password needed.</p>
 <label for="email">EMAIL</label><input class="field" id="email" type="email" autocomplete="email">
 <label for="dname">DISPLAY NAME (first sign-in)</label><input class="field" id="dname" maxlength="24" placeholder="e.g. Iyo">
 <button class="primary" id="send">Send magic link</button>
 <button class="secondary" id="guest" style="width:100%;margin-top:10px;border-radius:9px">Preview as guest (no email)</button><p class="muted" id="msg"></p>
</section>

<main id="app" hidden>
 <div class="eyebrow">Dashboard</div><h1 id="greet"></h1>
 <p class="muted" id="next"></p>
 <div class="dash">
  <div class="box"><div class="muted">YOUR COLLECTION</div><div class="big" id="pct">0%</div><div class="muted" id="cnt"></div><div class="track"><div class="fill" id="bar"></div></div></div>
  <div class="box path" data-path="road-to-endgame"><h3>Road to Endgame</h3><div class="muted" id="p1"></div><div class="track"><div class="fill" id="b1"></div></div></div>
  <div class="box path" data-path="road-to-doomsday"><h3>Road to Doomsday</h3><div class="muted" id="p2">Coming soon.</div><div class="track"><div class="fill" id="b2"></div></div></div>
 </div>
 <div class="toolbar">
  <input id="q" type="search" placeholder="Search title or year…">
  <select id="fStudio"><option value="">All studios</option></select>
  <select id="fFr"><option value="">All franchises</option></select>
  <select id="fPath"><option value="">All pathways</option></select>
  <select id="fStat"><option value="">All</option><option value="u">To watch</option><option value="w">Watched</option></select>
  <select id="sort"><option value="r">Release order</option><option value="t">MCU timeline order</option><option value="a">A–Z</option></select>
 </div>
 <div class="layout" id="layout"><div id="list"></div><aside id="side" hidden></aside></div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Publishable key is safe in the browser. NEVER put a service-role/secret key here.
const sb = supabase.createClient("https://nwdlrcmcwnifduydomgf.supabase.co","sb_publishable_MlptRCYUuS_2qfOUTAEm9w_2v5nTs9O");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PHASES=["Phase One","Phase Two","Phase Three","Phase Four","Phase Five","Phase Six"];
const ORDER=[...PHASES,"20th Century Fox","Sony Pictures","Other studios"];
let user,name="",movies=[],paths=[],watched=new Set(),sel=null;

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s?.user?.id!==user?.id) location.reload(); });
  if(!session){ $("login").hidden=false; return; }
  user=session.user; $("who").hidden=false;
  const [p,m,pw,w]=await Promise.all([
    sb.from("profiles").select("display_name").eq("id",user.id).maybeSingle(),
    sb.from("movies").select("id,title,release_year,release_date,phase,timeline_order,world_year,synopsis,studios(name),movie_franchises(franchises(name))").eq("is_theatrical",true),
    sb.from("pathways").select("id,slug,name,pathway_movies(movie_id,sequence_number,viewing_type)"),
    sb.from("watch_progress").select("movie_id").eq("user_id",user.id)]);
  name=p.data?.display_name||(user.email?user.email.split("@")[0]:"Guest");
  movies=(m.data||[]).map(x=>({...x,studio:x.studios?.name||"",frs:x.movie_franchises.map(f=>f.franchises.name)}));
  paths=pw.data||[]; watched=new Set((w.data||[]).map(r=>r.movie_id));
  fill("fStudio",[...new Set(movies.map(x=>x.studio).filter(Boolean))].sort().map(s=>[s,s]));
  fill("fFr",[...new Set(movies.flatMap(x=>x.frs))].sort().map(s=>[s,s]));
  fill("fPath",paths.map(p=>[p.slug,p.name]));
  const nn=name.toLowerCase().replace(/[^a-z]/g,"");
  const special=/^(jai|jay|jaiane|jayane|jayan|jaian|yang|buyang)+$/.test(nn);   // add more name pieces here
  $("greet").textContent=`Welcome back, ${name}. Ready for your next Marvel movie?`+(special?" I love you ❤️":"");
  $("app").hidden=false; render();
}
function fill(id,opts){ $(id).insertAdjacentHTML("beforeend",opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")); }
function hue(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 45% 26%)`;}
const pathMovies=slug=>{const p=paths.find(x=>x.slug===slug);return p?p.pathway_movies.map(x=>x.movie_id):[];};
const rkey=m=>m.release_date||`${m.release_year}-07-01`;
const group=m=>m.phase||(["20th Century Fox","Sony Pictures"].includes(m.studio)?m.studio:"Other studios");
const fmt=d=>d?new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric",timeZone:"UTC"}):"";

function thumb(m,big){const s=m.studio==="Marvel Studios"?"MARVEL STUDIOS":m.studio.toUpperCase();
  return `<div class="poster" style="--c1:${hue(m.title)}"><i>${esc(s)}</i><b>${esc(m.title)}</b><em>${m.release_year}</em></div>`;}

function render(){
  const total=movies.length,done=movies.filter(m=>watched.has(m.id)).length,pct=total?Math.round(done/total*100):0;
  $("pct").textContent=pct+"%";$("cnt").textContent=`${done} / ${total} watched`;$("bar").style.width=pct+"%";
  [["road-to-endgame","p1","b1"],["road-to-doomsday","p2","b2"]].forEach(([s,t,b])=>{
    const ids=pathMovies(s); if(!ids.length) return;
    const d=ids.filter(i=>watched.has(i)).length; $(t).textContent=`${d} / ${ids.length} watched`; $(b).style.width=Math.round(d/ids.length*100)+"%";});
  const pm=pathMovies("road-to-endgame").map(id=>movies.find(m=>m.id===id)).filter(Boolean).sort((a,b)=>rkey(a).localeCompare(rkey(b)));
  const nx=pm.find(m=>!watched.has(m.id))||movies.find(m=>!watched.has(m.id));
  $("next").textContent=nx?`Up next: ${nx.title} (${nx.release_year})`:"You’ve watched everything in the library.";

  const q=$("q").value.toLowerCase(),st=$("fStudio").value,fr=$("fFr").value,pa=$("fPath").value,sw=$("fStat").value,so=$("sort").value;
  const pset=pa?new Set(pathMovies(pa)):null;
  const list=movies.filter(m=>(!q||m.title.toLowerCase().includes(q)||String(m.release_year).includes(q))
    &&(!st||m.studio===st)&&(!fr||m.frs.includes(fr))&&(!pset||pset.has(m.id))&&(!sw||(sw==="w")===watched.has(m.id)));
  const cmp=so==="a"?(a,b)=>a.title.localeCompare(b.title):so==="t"?(a,b)=>(a.timeline_order??999)-(b.timeline_order??999)||rkey(a).localeCompare(rkey(b)):(a,b)=>rkey(a).localeCompare(rkey(b))||a.id-b.id;
  list.sort(cmp);
  const G={}; list.forEach(m=>{const k=so==="t"&&m.phase?"MCU timeline (in-universe order)":group(m);(G[k]??=[]).push(m);});
  const keys=Object.keys(G).sort((a,b)=>{const f=k=>k.startsWith("MCU")?-1:ORDER.indexOf(k);return f(a)-f(b);});
  $("list").innerHTML=keys.map(k=>`<section><div class="sec"><h2 class="${PHASES.includes(k)||k.startsWith("MCU")?"mcu":""}">${esc(k)}</h2><span>${G[k].filter(m=>watched.has(m.id)).length} / ${G[k].length} watched</span></div>
   <div class="grid">${G[k].map(m=>`<article class="card ${watched.has(m.id)?"done":""} ${sel===m.id?"sel":""}" data-open="${m.id}" title="${esc(m.title)}">${thumb(m)}</article>`).join("")}</div></section>`).join("")
   ||'<div class="empty">No movies match.</div>';
  renderSide();
}
function renderSide(){
  const m=movies.find(x=>x.id===sel), side=$("side");
  $("layout").classList.toggle("open",!!m); side.hidden=!m; if(!m) return;
  const d=watched.has(m.id), ps=paths.map(p=>{const x=p.pathway_movies.find(x=>x.movie_id===m.id);return x?`${p.name} · ${x.viewing_type}`:null}).filter(Boolean);
  side.innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button>${thumb(m,1)}
   <h3>${esc(m.title)}</h3>
   <div class="row">Released: <span>${esc(fmt(m.release_date)||m.release_year)}</span></div>
   ${m.world_year?`<div class="row">Story year: <span>${esc(m.world_year)}</span></div>`:""}
   <div class="row">Studio: <span>${esc(m.studio||"—")}</span></div>
   ${m.phase?`<div class="row">MCU: <span>${esc(m.phase)}${m.timeline_order?` · #${m.timeline_order} in story order`:""}</span></div>`:""}
   <div class="chips">${m.frs.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}${ps.map(p=>`<span class="chip g">${esc(p)}</span>`).join("")}</div>
   <p class="syn">${m.synopsis?esc(m.synopsis):"Synopsis coming soon."}</p>
   <button class="check ${d?"done":""}" data-id="${m.id}">${d?"✓ Watched (tap to undo)":"Mark as watched"}</button>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-id]");
  if(b){ const id=+b.dataset.id, was=watched.has(id);
    was?watched.delete(id):watched.add(id); render();               // optimistic
    const r=was?await sb.from("watch_progress").delete().eq("user_id",user.id).eq("movie_id",id)
               :await sb.from("watch_progress").upsert({user_id:user.id,movie_id:id});
    if(r.error){ was?watched.add(id):watched.delete(id); render(); alert("Couldn’t save: "+r.error.message); }
    return; }
  if(e.target.closest("[data-close]")){ sel=null; render(); return; }
  const c=e.target.closest("[data-open]");
  if(c){ const id=+c.dataset.open; sel=sel===id?null:id; render(); }
});
["q","fStudio","fFr","fPath","fStat","sort"].forEach(i=>$(i).addEventListener("input",render));
document.querySelectorAll(".path").forEach(p=>p.onclick=()=>{$("fPath").value=p.dataset.path;render();$("list").scrollIntoView({behavior:"smooth"});});
$("out").onclick=async()=>{await sb.auth.signOut();location.reload();};
$("send").onclick=async()=>{
  const email=$("email").value.trim(); if(!email) return;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,data:{display_name:$("dname").value.trim()}}});
  $("msg").textContent=error?error.message:"Check your email for the sign-in link.";
};
$("guest").onclick=async()=>{
  const {error}=await sb.auth.signInAnonymously({options:{data:{display_name:"Guest"}}});
  $("msg").textContent=error?error.message:"";
};
init();
</script>
</body>
</html>
