function replay(h){const l=h.it.map(i=>({i,q:allQ().find(x=>x.id==i.id)})).filter(x=>x.q&&(!HW||!x.i.ok)),
bk=`<div class="row" style="margin:0 0 12px"><button class="btn" onclick="HV=null;route()">← History</button><label class="sm"><input type="checkbox" ${HW?'checked':''} onchange="HW=this.checked?1:0;HI=0;route()"> Wrong answers only</label></div>`;
if(!l.length)return bk+empty('Nothing to show.');HI=Math.min(HI,l.length-1);const{i,q}=l[HI],n=l.length;

function imgBlob(f){return new Promise((res,rej)=>{if(!f)return res(null);const r=new FileReader();r.onerror=()=>rej(new Error('Could not read that image'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new Error('That file is not a readable image'));
i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Image conversion failed')),'image/jpeg',.85)};i.src=r.result};r.readAsDataURL(f)})}
async function putImg(blob,off){if(!blob)return '';const p=(off?'official':ME.id)+'/'+crypto.randomUUID()+'.jpg',u=await sb.storage.from('flashcard-images').upload(p,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;return p}

V.myq=()=>{const l=sortBy(D.MQ.filter(x=>!MQF.q||(x.q+' '+x.s+' '+x.t).toLowerCase().includes(MQF.q.toLowerCase())),MQF.so,x=>x.q,x=>x.ts);
return hd('My Questions','Your own questions are private. They appear in quizzes and flashcards when you choose “My questions”.')+`<div class="w sec stack"><div class="row" style="margin:0;justify-content:space-between"><div class="row" style="margin:0"><button class="btn p" onclick="openQEd(null,0)">＋ Add question</button><label class="btn">↑ Import CSV<input type="file" accept=".csv" hidden onchange="impCsv(this,1)"></label><a class="lk sm" onclick="dlTemplate()">CSV template</a></div><div class="row" style="margin:0"><input id="mqs" placeholder="Search…" value="${E(MQF.q)}" oninput="MQF.q=this.value;route();const i=$('#mqs');i.focus();i.setSelectionRange(99,99)">${dd('mqo',SORTS,MQF.so,"MQF.so=v;route()")}</div></div>
<div class="g">${l.map(x=>`<div class="card fr"><div class="fl" onclick="openQEd('${x.id}',0)"><span class="qtx">${E(x.q.slice(0,90))}${x.q.length>90?'…':''}</span></div><div class="fx"><span class="tag">${x.c}</span><button class="dots" onclick="toggleMenu('mq_${x.id}',event)" aria-label="Question menu">⋮</button></div><p class="mu sm fd">${E(x.s)} › ${E(x.t)}</p>${mnu('mq_'+x.id,[['Edit',`openQEd('${x.id}',0)`],['Preview',`prevQ('${x.id}')`],['Duplicate',`dupQ('${x.id}')`],['Delete',`showConfirm('Delete question','Delete this question?',()=>del('MQ','${x.id}'))`,1]])}</div>`).join('')||empty('You have not added any questions yet.')}</div></div>`};

/* ===== ADMIN ===== */
let AT='o',AQ={c:'',s:'',t:'',d:'',x:'',p:'',so:'num',q:'',pg:0},QSEL=new Set(),AC={c:'',q:'',so:'az'},CSEL=new Set(),AUS={q:'',so:'az'};
const PER=20,isNR=x=>/need/i.test(x.st);
function aqList(){const q=AQ.q.toLowerCase(),l=OQ.filter(x=>(!AQ.c||x.c==AQ.c)&&(!AQ.s||x.s==AQ.s)&&(!AQ.t||x.t==AQ.t)&&(!AQ.d||x.d==AQ.d)&&(!AQ.x||(AQ.x=='nr')==isNR(x))&&(!AQ.p||(AQ.p=='h')==!x.pub)&&(!q||(x.q+' '+x.s+' '+x.t).toLowerCase().includes(q)));
return l.sort(AQ.so=='az'?(a,b)=>cmp(a.q,b.q):AQ.so=='sub'?(a,b)=>cmp(a.s+' '+a.t,b.s+' '+b.t):AQ.so=='new'?(a,b)=>b.ts-a.ts:(a,b)=>cmp(a.c,b.c)||cmp(a.s,b.s)||((a.n||0)-(b.n||0)))}
const aqRst="AQ.pg=0;route()";
function aqBar(){const b=OQ.filter(x=>!AQ.c||x.c==AQ.c),sj=[...new Set(b.map(x=>x.s))].sort(cmp),tp=[...new Set(b.filter(x=>!AQ.s||x.s==AQ.s).map(x=>x.t))].sort(cmp);
return `<div class="bar">${dd('aqC',[['','All components'],...C],AQ.c,"AQ.c=v;AQ.s='';AQ.t='';"+aqRst)}${dd('aqS',[['','All subjects'],...sj],AQ.s,"AQ.s=v;AQ.t='';"+aqRst)}${dd('aqT',[['','All topics'],...tp],AQ.t,"AQ.t=v;"+aqRst)}${dd('aqD',[['','Any difficulty'],'Easy','Medium','Hard'],AQ.d,"AQ.d=v;"+aqRst)}${dd('aqX',[['','Any status'],['ok','Verified'],['nr','Needs review']],AQ.x,"AQ.x=v;"+aqRst)}${dd('aqP',[['','Published and hidden'],['v','Published only'],['h','Hidden only']],AQ.p,"AQ.p=v;"+aqRst)}${dd('aqO',[['num','Question number'],['az','Question A → Z'],['sub','Subject / topic A → Z'],['new','Newest first']],AQ.so,"AQ.so=v;"+aqRst)}<input id="aqq" placeholder="Search questions…" value="${E(AQ.q)}" oninput="AQ.q=this.value;AQ.pg=0;route();const i=$('#aqq');i.focus();i.setSelectionRange(99,99)"></div>`}
function qSel(id){QSEL.has(id)?QSEL.delete(id):QSEL.add(id);route()}
const qIds=()=>[...QSEL].filter(id=>OQ.some(x=>x.id==id));
async function qBulk(a){const ids=qIds();if(!ids.length)return toast('Select questions first');
const chunks=async fn=>{for(let i=0;i<ids.length;i+=50){const r=await fn(ids.slice(i,i+50));if(r.error)throw r.error}};
if(a=='del')return showConfirm('Delete questions','Delete '+ids.length+' question(s) permanently?',async()=>{await chunks(c=>sb.from('questions').delete().in('id',c));OQ=OQ.filter(x=>!ids.includes(x.id));QSEL.clear();toast('Deleted');route()});
if(a=='mv')return openMdl({title:'Move '+ids.length+' question(s)',okText:'Move',body:`<div class="g2"><div class="field"><label>Component</label>${dd('bmC',[['','Keep as is'],...C],'')}</div><div class="field"><label>Subject</label><input id="bmS" placeholder="Keep as is"></div><div class="field"><label>Topic</label><input id="bmT" placeholder="Keep as is"></div></div>`,
onOk:async()=>{const p={},c=v('bmC'),s=v('bmS').trim(),t=v('bmT').trim();if(c)p.component=c;if(s)p.subject=s;if(t)p.topic=t;if(!Object.keys(p).length){toast('Choose something to change');return false}
await chunks(k=>sb.from('questions').update(p).in('id',k));OQ.forEach(x=>{if(ids.includes(x.id)){if(c)x.c=c;if(s)x.s=s;if(t)x.t=t}});toast('Moved');route()}});
const m={pub:[{published:true},{pub:1}],hide:[{published:false},{pub:0}],ver:[{verification_status:'Verified'},{st:'Verified'}],nr:[{verification_status:'Needs Review'},{st:'Needs Review'}]}[a];
await chunks(k=>sb.from('questions').update(m[0]).in('id',k));OQ.forEach(x=>{if(ids.includes(x.id))Object.assign(x,m[1])});toast('Updated '+ids.length+' question(s)');route()}
const aqRow=x=>{const on=QSEL.has(x.id);return `<div class="card fr ${on?'selected':''}"><label class="fl"><input type="checkbox" class="selbox" ${on?'checked':''} onchange="qSel('${x.id}')"><span class="qtx"><b>${x.n?'#'+x.n+' · ':''}</b>${E(x.q.slice(0,120))}${x.q.length>120?'…':''}</span></label><div class="fx"><span class="tag">${x.c}</span><span class="tag">${E(x.s)}</span>${x.pub?'':'<span class="tag">Hidden</span>'}${isNR(x)?'<span class="tag">Needs review</span>':''}${x.qi||x.ei?'<span class="tag">figure</span>':''}<button class="dots" onclick="toggleMenu('aq_${x.id}',event)" aria-label="Question menu">⋮</button></div>${mnu('aq_'+x.id,[['Edit',`openQEd('${x.id}',1)`],['Preview',`prevQ('${x.id}')`],['Duplicate',`dupQ('${x.id}')`],[x.pub?'Hide from students':'Publish',`setQ('${x.id}',{published:${!x.pub}},{pub:${x.pub?0:1}})`],[isNR(x)?'Mark as verified':'Mark as needs review',`setQ('${x.id}',{verification_status:'${isNR(x)?'Verified':'Needs Review'}'},{st:'${isNR(x)?'Verified':'Needs Review'}'})`],['Delete',`showConfirm('Delete question','Delete this question permanently?',()=>qDel('${x.id}'))`,1]])}</div>`};
async function qDel(id){const r=await sb.from('questions').delete().eq('id',id);if(r.error)return toast(r.error.message);OQ=OQ.filter(x=>x.id!=id);QSEL.delete(id);route()}
const pager=(n,pg,fn)=>n>PER?`<div class="pgn"><button class="btn" ${pg?'':'disabled'} onclick="${fn}(-1)">← Prev</button><span class="mu sm">${pg*PER+1}–${Math.min(n,(pg+1)*PER)} of ${n}</span><button class="btn" ${(pg+1)*PER<n?'':'disabled'} onclick="${fn}(1)">Next →</button></div>`:'';
function aqPage(d){AQ.pg=Math.max(0,AQ.pg+d);route()}
function aqQ(){const l=aqList(),pg=Math.min(AQ.pg,Math.max(0,Math.ceil(l.length/PER)-1)),rows=l.slice(pg*PER,(pg+1)*PER),nr=OQ.filter(isNR).length;AQ.pg=pg;
return `<div class="row" style="margin:0 0 12px;justify-content:space-between"><div class="row" style="margin:0"><button class="btn p" onclick="openQEd(null,1)">＋ Add question</button><label class="btn">↑ Import CSV<input type="file" accept=".csv" hidden onchange="impCsv(this,0)"></label><a class="lk sm" onclick="dlTemplate()">CSV template</a></div><span class="mu sm">${OQ.length} official questions${nr?' · '+nr+' need review':''}</span></div>${aqBar()}
${QSEL.size?`<div class="selbar"><b>${QSEL.size} selected</b><a class="lk sm" onclick="aqList().forEach(x=>QSEL.add(x.id));route()">Select all ${l.length} filtered</a><a class="lk sm" onclick="QSEL.clear();route()">Clear</a><span class="sp"></span><button class="btn" onclick="qBulk('pub')">Publish</button><button class="btn" onclick="qBulk('hide')">Hide</button><button class="btn" onclick="qBulk('ver')">Mark verified</button><button class="btn" onclick="qBulk('mv')">Move…</button><button class="btn" onclick="qBulk('del')">Delete</button></div>`:`<p class="mu sm" style="margin:0 0 8px">Tick questions to select several at once.</p>`}
<div class="stack" style="margin-top:12px">${rows.map(aqRow).join('')||empty('No questions match these filters.')}</div>${pager(l.length,pg,'aqPage')}`}

/* official cards */
const acList=()=>sortBy(D.F.filter(x=>!x.own&&(!AC.c||x.c==AC.c)&&(!AC.q||(x.f+' '+x.b).toLowerCase().includes(AC.q.toLowerCase()))),AC.so,x=>x.f,x=>x.ts);
function cSel(id){CSEL.has(id)?CSEL.delete(id):CSEL.add(id);route()}
async function cBulk(a){const ids=[...CSEL].filter(id=>D.F.some(x=>x.id==id));if(!ids.length)return toast('Select cards first');
if(a=='del')return showConfirm('Delete cards','Delete '+ids.length+' card(s)?',async()=>{const r=await sb.from('flashcards').delete().in('id',ids);if(r.error)throw r.error;D.F=D.F.filter(x=>!ids.includes(x.id));CSEL.clear();toast('Deleted');route()});
const p=a=='pub';const r=await sb.from('flashcards').update({published:p}).in('id',ids);if(r.error)return toast(r.error.message);D.F.forEach(x=>{if(ids.includes(x.id))x.pub=p});toast('Updated');route()}
async function pub(id){const x=D.F.find(x=>x.id==id),r=await sb.from('flashcards').update({published:!x.pub}).eq('id',id);if(r.error)return toast(r.error.message);x.pub=!x.pub;route()}
function aqCards(){const l=acList();return `<div class="row" style="margin:0 0 12px;justify-content:space-between"><button class="btn p" onclick="openCardEd(null,1)">＋ New official card</button><div class="row" style="margin:0">${dd('acC',[['','All components'],...C],AC.c,"AC.c=v;route()")}<input id="acq" placeholder="Search…" value="${E(AC.q)}" oninput="AC.q=this.value;route();const i=$('#acq');i.focus();i.setSelectionRange(99,99)">${dd('acO',SORTS,AC.so,"AC.so=v;route()")}</div></div>
${CSEL.size?`<div class="selbar"><b>${CSEL.size} selected</b><a class="lk sm" onclick="acList().forEach(x=>CSEL.add(x.id));route()">Select all ${l.length}</a><a class="lk sm" onclick="CSEL.clear();route()">Clear</a><span class="sp"></span><button class="btn" onclick="cBulk('pub')">Publish</button><button class="btn" onclick="cBulk('hide')">Hide</button><button class="btn" onclick="cBulk('del')">Delete</button></div>`:''}
<div class="stack" style="margin-top:12px">${l.map(x=>{const on=CSEL.has(x.id);return `<div class="card fr ${on?'selected':''}"><label class="fl"><input type="checkbox" class="selbox" ${on?'checked':''} onchange="cSel('${x.id}')"><span class="qtx">${E(x.f.slice(0,100))}</span></label><div class="fx"><span class="tag">${x.c}</span>${x.pub?'':'<span class="tag">Hidden</span>'}${x.img||x.fimg?'<span class="tag">figure</span>':''}<button class="dots" onclick="toggleMenu('ac_${x.id}',event)" aria-label="Card menu">⋮</button></div>${mnu('ac_'+x.id,[['Edit',`openCardEd('${x.id}',1)`],['Duplicate',`dupCard('${x.id}')`],[x.pub?'Hide':'Publish',`pub('${x.id}')`],['Delete',`showConfirm('Delete card','Delete this card?',()=>del('F','${x.id}'))`,1]])}</div>`}).join('')||empty('No official cards yet.')}</div>`}

const AD={
o:()=>`<div class="g">${[['Users',D.U.length],['Official questions',OQ.length],['Folders',D.FO.length],['Folder items',D.M.length],['Official flashcards',D.F.filter(x=>!x.own).length]].map(([n,x])=>`<div class="card art stat"><b>${x}</b><span class="mu sm">${n}</span></div>`).join('')}</div>`,
u:()=>{const l=sortBy(D.U.filter(u=>!AUS.q||(u.display_name||'').toLowerCase().includes(AUS.q.toLowerCase())),AUS.so,u=>u.display_name||'',u=>T0(u.created_at));
return `<div class="row" style="margin:0 0 12px"><input id="aus" placeholder="Search users…" value="${E(AUS.q)}" oninput="AUS.q=this.value;route();const i=$('#aus');i.focus();i.setSelectionRange(99,99)">${dd('auo',SORTS,AUS.so,"AUS.so=v;route()")}</div><table><tr><th>Name</th><th>Role</th><th>Joined</th></tr>${l.map(u=>`<tr><td>${E(u.display_name||'')}</td><td>${u.role}</td><td class="mu sm">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</table><p class="mu sm">To change someone's role, edit the profiles table in Supabase (Table Editor).</p>`},
f:aqCards,q:aqQ};
V.admin=()=>hd('Admin Dashboard','Manage official content. Security is enforced by the database rules (RLS).')+`<div class="w sec"><div class="tabs">${[['o','Overview'],['u','Users'],['f','Official cards'],['q','Questions']].map(([k,n])=>`<a class="${AT==k?'on':''}" onclick="AT='${k}';route()">${n}</a>`).join('')}</div>${AD[AT]()}</div>`;

/* ===== MENU, TOP BAR, LOGIN, ROUTER ===== */
const drawer=(n,a)=>{const cur=n=='f'?(D.FO.find(x=>x.id==a)||{}).c:a,lnk=(h,t,on)=>`<a${on?' class="on"':''} onclick="dr(0);${h}">${t}</a>`;
return lnk("go('dash')",'Dashboard',n=='dash')+lnk("go('quiz')",'Quiz',n=='quiz')+lnk("go('hist')",'Quiz History',n=='hist')+`<p class="dl">Components</p>`+C.map(c=>lnk(`go('c/${c}')`,c,(n=='c'||n=='f')&&cur==c)).join('')+`<p class="dl">Study</p>`+lnk("FF={c:'',k:''};go('cards')",'Flashcards',n=='cards'&&FF.k!='img')+lnk("FF={c:'',k:'img'};go('cards')",'Formula Cards',n=='cards'&&FF.k=='img')+lnk("go('myq')",'My Questions',n=='myq')+(role=='admin'?`<p class="dl">Admin</p>`+lnk("go('admin')",'Admin Dashboard',n=='admin'):'')+`<p class="dl"></p>`+lnk("out()",'Log out',false)};
const tbar=()=>ME?`<span class="sm mu" style="white-space:nowrap">${E(PR&&PR.display_name||'')} <span class="tag">${role}</span></span>`:`<button class="btn" onclick="AU.mode='in';AU.msg='';go('auth')">Log in</button> <button class="btn p" onclick="AU.mode='up';AU.msg='';go('auth')">Sign up</button>`;
function out(){sb.auth.signOut()}
V.auth=()=>{const m=AU.mode,T={in:'Log in',up:'Create account',reset:'Reset password',newpw:'Set a new password'};
return hd(T[m],m=='newpw'?'Choose a new password for your account.':'Sign in to save your progress and keep it on every device.')+`<div class="w sec"><div class="card art stack" style="max-width:440px;margin:auto">${AU.msg?`<div class="exp">${E(AU.msg)}</div>`:''}${m=='up'?'<input id="an" placeholder="Display name" style="width:100%">':''}${m=='newpw'?'':'<input id="ae" type="email" placeholder="Email" autocomplete="email" style="width:100%">'}${m=='reset'?'':`<input id="ap" type="password" placeholder="${m=='newpw'?'New password':'Password'}" autocomplete="${m=='in'?'current-password':'new-password'}" style="width:100%">`}<button class="btn p" onclick="doAuth()">${T[m]}</button><p class="sm">${m=='in'?`<a class="lk" onclick="AU.mode='up';AU.msg='';route()">Create an account</a> · <a class="lk" onclick="AU.mode='reset';AU.msg='';route()">Forgot password?</a>`:m=='newpw'?'':`<a class="lk" onclick="AU.mode='in';AU.msg='';route()">Back to log in</a>`}</p></div></div>`};
async function doAuth(){const m=AU.mode,e=m=='newpw'?'':v('ae').trim(),p=m=='reset'?'':v('ap');let r;
if(m=='up'){if(p.length<6)return toast('Password needs at least 6 characters');r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:v('an').trim()||e.split('@')[0]}}})}
else if(m=='in')r=await sb.auth.signInWithPassword({email:e,password:p});
else if(m=='reset'){r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(!r.error){AU.msg='Check your email for the reset link.';return route()}}
else{r=await sb.auth.updateUser({password:p});if(!r.error){AU.mode='in';toast('Password updated');return go('dash')}}
if(r.error)return toast(r.error.message);
if(m=='up'&&!r.data.session){AU.msg='Account created. Check your email to confirm it, then log in.';route()}}
  
function route(){clearTimeout(tk);const[n0,a]=(location.hash.slice(2)||'home').split('/');let n=V[n0]?n0:'home';
if(!QL){$('#app').innerHTML='<div class="w sec">'+empty('Loading…')+'</div>';$('#tb').innerHTML='';$('#bg').style.display='none';return}
if(!ME&&!['home','auth'].includes(n))n='auth';
if(ME&&n=='auth'&&AU.mode!='newpw')n='dash';
if(n=='admin'&&role!='admin'){toast('Admins only');n='dash'}
const ap=$('#app');ap.innerHTML=V[n](a);if(nv){ap.className='';void ap.offsetWidth;ap.className='in';nv=0}
$('#tb').innerHTML=tbar();$('#dr').innerHTML=ME?drawer(n,a):'';syncTheme();$('#bg').style.display=ME?'':'none';
renderFab();
renderCustomConfirm();
renderFileViewer();
if(n=='quiz'&&QZ&&!QZ.done){cnt();if(QZ.end)tick()}else smry()}
addEventListener('hashchange',()=>{nv=1;scrollTo(0,0);route()});
addEventListener('keydown',e=>{if(e.key=='Enter'&&location.hash=='#/auth'&&e.target.tagName=='INPUT')doAuth()});
/* session: runs on page load, login, logout and password-reset links */
sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
if(ev=='PASSWORD_RECOVERY')AU.mode='newpw';
ME=s&&s.user||null;
if(!ME){CU=null;D={FO:[],M:[],F:[],MQ:[],U:[]};P={h:[],q:{},fc:{},bm:[],op:{}};OQ=[];PR=null;role='student';QZ=null;QL=1;if(ev=='SIGNED_OUT')go('home');else route();return}
if(ME.id!=CU){CU=ME.id;QL=0;route();await load();QL=1}
if(AU.mode=='newpw')go('auth');else if(location.hash=='#/auth')go('dash');else route()},0));
route();
</script>
</body>
