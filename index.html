<style>
/* ===== COLOR SYSTEM: change colors here only ===== */
:root{
--aq:#9FD3D0;      /* Pantone 13-5410 TPG Iced Aqua (approximate hex) */
--aq2:#8CC6C3;--soft:#E8F5F4;--teal:#2F7F80;--ink:#0E3B3C;
--bg:#fff;--bg2:#F7FAFA;--tx:#171717;--mu:#737373;--bd:#E5E7EB;--r:6px;
/* ===== ABSTRACT MOTIF: one design reused everywhere ===== */
--art:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' fill='none' stroke='%239FD3D0' stroke-width='1.5'><circle cx='200' cy='200' r='30'/><circle cx='200' cy='200' r='60'/><circle cx='200' cy='200' r='90'/><circle cx='200' cy='200' r='120'/><circle cx='60' cy='50' r='14' fill='%23D9EEED' stroke='none'/><path d='M0 120L120 0M0 160L160 0M0 80L80 0'/><circle cx='100' cy='100' r='3' fill='%239FD3D0'/></svg>")}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main#app{flex:1 0 auto}footer{flex:none}
a,.lk{cursor:pointer;text-decoration:none;color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
.art{background-image:var(--art);background-repeat:no-repeat;background-position:right -30px top -30px;background-size:240px}
header{border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--hdr);z-index:5}
.hi{display:flex;align-items:center;gap:10px;height:56px}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.brand i{color:var(--teal);font-style:normal}
.seg{display:flex;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font-size:.85rem;cursor:pointer}.seg .on{background:var(--aq);color:var(--ink);font-weight:600}
#dr{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .2s;z-index:20;padding:14px;overflow:auto}
#dr.on{transform:none}#dr a{display:block;padding:8px 10px;border-radius:var(--r)}#dr a:hover{background:var(--soft)}
.dl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 10px 4px}
#ov{display:none;position:fixed;inset:0;background:#0005;z-index:19}#ov.on{display:block}
.btn{display:inline-block;padding:8px 16px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);font-size:.95rem;font-weight:500;cursor:pointer;color:var(--tx);transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--teal)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--aq);border-color:var(--teal);color:var(--ink)}.btn.p:hover{background:var(--aq2)}
.hero{background-color:var(--bg2);border-bottom:1px solid var(--bd);padding:72px 0;background-size:460px;background-position:right -60px center}
.hero h1{font-size:2.2rem;line-height:1.2;max-width:600px;margin:8px 0 14px}
.eyebrow{color:var(--teal);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.lead{color:var(--mu);max-width:540px;margin-bottom:22px}
.ph.wl h1,.ph.wl p{}
@media(min-width:901px){.ph.wl{padding:44px 0}.ph.wl h1{font-size:2.5rem;line-height:1.15}.ph.wl p{font-size:1.12rem;margin-top:4px}}
.ph{background-color:var(--bg2);border-bottom:1px solid var(--bd);padding:30px 0}.ph h1{font-size:1.8rem}
.sec{padding:28px 0 48px}.sec h2{margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background-color:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;transition:transform .12s,border-color .12s}
.card.art{background-size:130px;background-position:right -35px bottom -35px}
.card[onclick]:hover{transform:translateY(-2px);border-color:var(--aq)}
.card h3{margin-bottom:6px;color:var(--ink)}
.empty{grid-column:1/-1}.stack>*+*{margin-top:16px}
.stat b{display:block;font-size:1.6rem;color:var(--ink)}
.mu{color:var(--mu)}.sm{font-size:.85rem}.lb{font-weight:600;color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--ink);border:1px solid var(--aq)}
.star{margin-left:auto;font-size:1.2rem;color:var(--teal)}.lk{color:var(--teal)}
.pb{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:4px 0}.pb b{display:block;height:100%;background:var(--teal);animation:gr .6s ease-out}
@keyframes gr{from{width:0}}@keyframes in{from{opacity:0;transform:translateY(6px)}}#app.in{animation:in .25s ease-out}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);max-width:100%}textarea{width:100%;min-height:70px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:18px;flex-wrap:wrap}
.tabs a{padding:8px 14px;border-bottom:2px solid transparent}.tabs a.on{border-color:var(--teal);font-weight:600;color:var(--ink)}
.qt{margin:10px 0;font-weight:500}
.opt{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r);margin:8px 0;cursor:pointer}
.opt.ok{border-color:#2e9e6b;background:#eaf7f0}.opt.no{border-color:#d9534f;background:#fdeeee}
.exp{background:var(--soft);padding:10px 12px;border-radius:var(--r);font-size:.95rem}
.qbar{position:sticky;top:56px;z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--teal);border-radius:var(--r);padding:8px 12px;margin-bottom:14px}
.qbar b{font-size:1.2rem;color:var(--ink)}.qbar b.low{color:#d9534f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;font-size:.85rem;cursor:pointer;display:flex;gap:6px;align-items:center}.chip:has(input:checked){background:var(--soft);border-color:var(--aq)}
.fc{perspective:900px;cursor:pointer}.fi{position:relative;min-height:270px;transition:transform .35s;transform-style:preserve-3d}.fc.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;text-align:center;padding:24px;border:1px solid var(--bd);border-radius:var(--r);background-color:var(--card);overflow:auto;font-size:1.1rem}
.ff>*,.fb>*{margin:auto}
.ff{background-image:var(--art);background-repeat:no-repeat;background-position:right -30px bottom -30px;background-size:150px}
.fb{transform:rotateY(180deg);background:var(--soft)}.fb img{max-width:100%;max-height:220px;object-fit:contain}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}.strip i{width:12px;height:12px;border-radius:2px;background:#d9534f}.strip i.g{background:#2e9e6b}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:12px}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
footer{border-top:1px solid var(--bd);padding:22px 0;color:var(--mu);font-size:.9rem;background-size:150px;background-position:right -40px center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:.9rem;display:none;z-index:30}
@media(max-width:600px){.hero{padding:44px 0;background-size:300px}.hero h1{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.g.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.g.list>.card{
  width:100%;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.g.list>.card h3{
  margin:0;
}

.g.list>.card p{
  margin:4px 0;
}
/* ===== FLOATING ACTION BUTTON: Relocated & Prominent ===== */
#fabRoot{position:fixed;right:48px;bottom:70px;z-index:40}
.fab{
  width:64px;height:64px;border:0;border-radius:50%;
  background:var(--teal);color:#fff;font-size:2.4rem;
  line-height:1;cursor:pointer;box-shadow:0 8px 24px #0005;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s, background .2s, box-shadow .2s;
}
.fab:hover{background:var(--ink);transform:scale(1.1);box-shadow:0 12px 32px #0006}
.fm-backdrop{
  position:fixed;inset:0;background:#0006;z-index:50;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.fm-card{
  width:100%;max-width:440px;max-height:90vh;overflow:auto;
  background:var(--card);border:1px solid var(--bd);border-radius:10px;
  padding:22px;box-shadow:0 12px 40px #0003;
}
.fm-card h2{font-size:1.3rem;color:var(--ink);margin-bottom:14px}
.fm-card input,.fm-card select,.fm-card textarea{width:100%}
.fm-card .field{margin-top:13px}
.fm-card .field label{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
.fm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.fm-modes{display:flex;gap:8px;margin-bottom:16px}
.fm-modes button{flex:1}
@media(max-width:600px){
  #fabRoot{right:18px;bottom:18px}
  .fab{width:54px;height:54px}
}
.custom-dropdown {
  position: relative;
  display: inline-block;
  min-width: 160px;
}
.custom-select-trigger {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  cursor: pointer;
  font-size: .95rem;
  color: var(--tx);
}
.custom-select-trigger:hover {
  border-color: var(--teal);
}
.custom-options {
  position: absolute;
  top: 105%;
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  box-shadow: 0 4px 16px #0002;
  z-index: 25;
  display: none;
  max-height: 220px;
  overflow-y: auto;
}
.custom-dropdown.open .custom-options {
  display: block;
}
.custom-option {
  padding: 8px 12px;
  cursor: pointer;
  font-size: .95rem;
  color: var(--tx);
}
.custom-option:hover {
  background: var(--soft);
  color: var(--ink);
}
/* ===== ADDED: mastery ring ===== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes ringin{from{--p:0}}
.ring{--p:0;width:92px;height:92px;flex:none;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;animation:ringin .8s ease-out}
.ring span{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:var(--ink)}
.mrow{display:flex;align-items:center;gap:14px}.mrow small{display:block;color:var(--mu);font-size:.85rem}
/* ===== ADDED: quiz history rows ===== */
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hl,.hr{display:flex;flex-direction:column;gap:2px}.hr{align-items:flex-end;text-align:right;gap:8px}
.hscore{font-size:1.4rem;font-weight:700;line-height:1.1;color:var(--ink)}.hscore small{font-size:.85rem;font-weight:500}
/* ===== ADDED: folder and file rows, popup menus ===== */
.fr{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.fl{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.fl h3{margin:0;font-size:1rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx{display:flex;align-items:center;gap:8px}.fx .star{margin-left:0}
.fd{flex-basis:100%;margin:0}.g.list .fd{display:none}
.dots{border:0;background:transparent;font-size:1.2rem;cursor:pointer;padding:2px 8px;color:var(--tx)}
.pop{position:absolute;right:12px;top:42px;background:var(--card);border:1px solid var(--bd);box-shadow:0 4px 16px #0002;border-radius:var(--r);z-index:20;padding:6px 0;min-width:150px}
.pop a{display:block;padding:8px 14px;font-size:.9rem;cursor:pointer}.pop a:hover{background:var(--soft)}.pop a.dng{color:#d9534f}
.fm-card.viewer{max-width:1000px;height:90vh;display:flex;flex-direction:column;padding:16px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:10px}
.vh h2{font-size:1.1rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{flex:1;overflow:auto;background:var(--bg2);border-radius:var(--r);display:flex;align-items:center;justify-content:center}.vb img{max-width:100%;max-height:100%;object-fit:contain}
/* custom dropdown fits forms and modals */
.stack>.custom-dropdown,.field .custom-dropdown{display:block;width:100%}
.custom-option.sel{background:var(--soft)}
/* ===== phones: footer sits at the very bottom of the page content (scrolls with it), a little smaller ===== */
@media(max-width:600px){
footer{padding:14px 0;font-size:.74rem;background-size:90px}
.hr{align-items:flex-start;text-align:left}
}
/* ===== DARK MODE (moon button in the header) ===== */
:root{--card:#fff;--hdr:#fffffff2;--onaq:#0E3B3C;--onfab:#fff;--toast:#0E3B3C;--okbg:#eaf7f0;--nobg:#fdeeee}
:root[data-theme="dark"]{--bg:#24003D;--bg2:#2B0A47;--card:#33145A;--soft:#432070;--bd:#54307E;--tx:#F1E9F7;--mu:#B9A3CC;--aq:#5EEAD4;--aq2:#45D5BF;--teal:#5EEAD4;--ink:#F4EEFB;--onaq:#24003D;--onfab:#24003D;--hdr:#24003DEB;--toast:#4A1D78;--okbg:#0E3F36;--nobg:#4A1634;color-scheme:dark}
.btn.p,.seg .on,#dr a.on{color:var(--onaq)}
#toast{background:var(--toast)}.fab{color:var(--onfab)}
.opt.ok{background:var(--okbg)}.opt.no{background:var(--nobg)}
.thm.on{background:var(--soft);border-color:var(--teal)}
#dr a.on{background:var(--aq);font-weight:600}
.ic{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}
.btn .ic{margin-right:4px}#thm.btn .ic{margin:0;width:1.15em;height:1.15em;vertical-align:-.2em}
.thm .ico .ic{width:3.2rem;height:3.2rem;color:var(--teal);stroke-width:1.5;margin:0}
.qtx .ic,.sbn .ic,.ph h1 .ic{margin-right:6px}
.tgl{display:inline-flex;gap:10px;align-items:center;cursor:pointer;position:relative}.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl i{width:40px;height:22px;border-radius:99px;background:var(--bd);position:relative;transition:background .15s;flex:none}
.tgl i:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px #0004}
.tgl input:checked+i{background:var(--teal)}.tgl input:checked+i:after{left:21px}.tgl input:focus-visible+i{outline:2px solid var(--aq);outline-offset:2px}
.rsh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.rsh h3{margin:0}.rsc .row:last-child{margin-top:6px!important}
/* ===== layout helpers ===== */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fig{display:block;max-width:100%;max-height:240px;object-fit:contain;margin:10px auto;border-radius:var(--r)}
.ff img{max-width:100%;max-height:200px;object-fit:contain}
.qtx{overflow:hidden;text-overflow:ellipsis}
.pgn{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}
.custom-select-trigger span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== selection bar and checkboxes ===== */
.selbar{position:sticky;top:60px;z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--teal);border-radius:var(--r);padding:8px 12px}
.selbar .sp{flex:1}
.selbox{width:18px;height:18px;margin-right:6px;accent-color:var(--teal);flex:none}
.card.selected{border-color:var(--teal);background-color:var(--soft)}
.fm-card input[type=checkbox]{width:auto}
.fm-card.wide{max-width:720px}
/* ===== multi-select dropdown ===== */
.ms .custom-options{max-height:300px;min-width:240px}
.mshead{display:flex;gap:10px;align-items:center;padding:8px;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd)}
.mshead input{flex:1;min-width:0;padding:5px 8px}
.msi{display:flex;gap:8px;align-items:center;padding:6px 12px;cursor:pointer;font-size:.9rem;margin:0}
.msi:hover{background:var(--soft)}.msi span{flex:1}
/* ===== FLASHCARDS: fixed 7:5 landscape on desktop, 5:7 portrait on phones, never edge to edge ===== */
.fcw{position:relative;width:min(100%,680px);aspect-ratio:7/5;margin:0 auto 14px}
.fcw::before{content:'';position:absolute;inset:0;transform:translateY(10px) scale(.95);border:1px solid var(--bd);border-radius:var(--r);background:var(--card);opacity:.7}
.fc{position:absolute;inset:0;z-index:1;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;animation:cardin .22s ease-out}
.fc.drag{cursor:grabbing;animation:none}
.fc img{pointer-events:none;-webkit-user-drag:none}
.fi{position:absolute;inset:0;min-height:0}
.ff,.fb{padding:22px;overflow:hidden;font-size:1rem;text-align:left}
.ff>.fcont,.fb>.fcont{margin:0}
.fcont{flex:1;min-width:0;display:flex;align-items:center;gap:16px}
.ftxt{flex:1.25;min-width:0;max-height:100%;overflow:hidden;line-height:1.35;overflow-wrap:anywhere}
.fcont.noimg{justify-content:center}.fcont.noimg .ftxt{flex:0 1 auto;max-width:100%}
.fimgw{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;justify-content:center}
.fimgw img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.fopts{margin-top:8px;font-size:.85em;color:var(--mu)}
@keyframes cardin{from{opacity:0;transform:scale(.94) translateY(12px)}}
@media(max-width:600px){.fcw{width:min(78vw,300px);aspect-ratio:5/7}.ff,.fb{padding:14px}.fcont{gap:10px}}
/* ===== NOTES PANEL: floating + movable + resizable on desktop, docked in the layout on phones ===== */
.notes{position:fixed;right:14px;top:70px;width:240px;min-width:170px;max-width:calc(100vw - 8px);display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--teal);border-radius:var(--r);box-shadow:0 6px 22px #0003;z-index:12}
.notes.mv{right:auto}
body.sbo .notes.dflt{right:334px}
.notes .nh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--bd);font-size:.85rem;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap}
.notes .nh a{margin-left:10px;cursor:pointer;color:var(--teal)}
@media(max-width:899px){.notes .nh a.ntp{display:none}}
.notes textarea{display:block;flex:1 1 auto;width:100%;min-height:0;height:38px;border:0;border-radius:0;resize:none;overflow-y:auto;font-size:.9rem;line-height:1.4;background:transparent;padding:8px 10px;color:var(--tx)}
.notes.min{width:auto!important;height:auto!important;min-width:0}
.notes.min .nh{border-bottom:0;cursor:pointer}.notes.min textarea,.notes.min .ngr,.notes.min .nc,.notes.min .ntp{display:none}
.ngr{position:absolute;bottom:0;width:14px;height:14px;z-index:2;touch-action:none;background:linear-gradient(135deg,transparent 52%,var(--mu) 52%,var(--mu) 62%,transparent 62%,transparent 74%,var(--mu) 74%,var(--mu) 84%,transparent 84%);opacity:.7}

}

/* ===== DRAG AND DROP ===== */

/* ===== drop and paste zones, access list ===== */

.aglist{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--bd);border-radius:var(--r)}

/* ===== FOLDER GRID: rounded squares, name in the top 1/5, thumbnail below ===== */
.g.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}

/* night/light toggle button shares the .thm class with folder thumbnails, keep it visible */

@media(hover:hover) and (pointer:fine){.fr[data-k] .fl{cursor:default}.fr[data-k] .nm{cursor:pointer}.fr[data-k] .nm:hover{text-decoration:underline;color:var(--teal)}}

/* ===== v2: fonts, halves, mini, alert ===== */

const dn=(n,u)=>{if(!u.includes(n))return n;const i=n.lastIndexOf('.'),b=i>0?n.slice(0,i):n,e=i>0?n.slice(i):'';let k=2;while(u.includes(b+' ('+k+')'+e))k++;return b+' ('+k+')'+e};

/* ===== STORAGE CLEAN DELETE: remove the real file from Supabase and report when it was blocked ===== */
async function rmStore(bucket,paths){paths=[...new Set((paths||[]).filter(Boolean))];if(!paths.length)return 0;let n=0;
for(let i=0;i<paths.length;i+=100){const r=await sb.storage.from(bucket).remove(paths.slice(i,i+100));if(r.error){console.warn(r.error.message);continue}n+=(r.data||[]).length}
if(n<paths.length){RMFAIL+=paths.length-n;console.warn('Storage removed '+n+' of '+paths.length+' in '+bucket+'. A missing storage DELETE policy does this.')}return n}
async function rmImgs(paths){const used=new Set([...D.F.flatMap(x=>[x.ip,x.fip]),...OQ.flatMap(x=>[x.qp,x.ep]),...D.MQ.flatMap(x=>[x.qp,x.ep])].filter(Boolean));
const gone=[...new Set((paths||[]).filter(Boolean))].filter(p=>!used.has(p));if(!gone.length)return;
const n=await rmStore('flashcard-images',gone);if(n<gone.length)toast('Deleted, but '+(gone.length-n)+' stored image(s) were not removed from Supabase storage.')}
function renameFolder(id){const f=D.FO.find(x=>x.id==id);if(!f)return;showPrompt('Rename folder','Folder name',f.name,async n=>{const r=await sb.from('folders').update({name:n}).eq('id',id);if(r.error)return toast(r.error.message);f.name=n;f.mod=Date.now();toast('Folder renamed');route()})}
function renameMaterial(id){const m=D.M.find(x=>x.id==id);if(!m)return;showPrompt('Rename file','File name',m.title,async n=>{const r=await sb.from('materials').update({title:n}).eq('id',id);if(r.error)return toast(r.error.message);m.title=n;m.mod=Date.now();toast('File renamed');route()})}
async function delFo(id,quiet){const f=D.FO.find(x=>x.id==id);if(!f)return;const ids=dsc(id),paths=D.M.filter(m=>ids.includes(m.fo)).map(m=>m.path).filter(Boolean);
for(const i of ids.slice().reverse()){const r=await sb.from('folders').delete().eq('id',i);if(r.error)return toast(r.error.message)}
if(paths.length){const n=await rmStore('review-materials',paths);if(n<paths.length&&!quiet)toast('Deleted, but '+(paths.length-n)+' stored file(s) were not removed from Supabase storage.')}
D.FO=D.FO.filter(x=>!ids.includes(x.id));D.M=D.M.filter(m=>!ids.includes(m.fo));P.bm=P.bm.filter(b=>D.M.some(m=>m.id==b));
if(!quiet){toast('Folder deleted');go(f.parent?'f/'+f.parent:'c/'+f.c)}}
async function delM(id,quiet){const m=D.M.find(x=>x.id==id);if(!m)return;const r=await sb.from('materials').delete().eq('id',id);if(r.error)return toast(r.error.message);
if(m.path){const n=await rmStore('review-materials',[m.path]);if(!n&&!quiet)toast('Deleted, but the stored file was not removed from Supabase storage.')}
D.M=D.M.filter(x=>x.id!=id);P.bm=P.bm.filter(x=>x!==id);if(!quiet)route()}
function moveMaterial(id){moveKeys(['m:'+id])}
function moveKeys(keys){const its=keys.map(k=>[k,gi(k)]).filter(x=>x[1]&&(x[0][0]=='f'?canFo(x[1]):canMat(x[1])));
if(!its.length)return toast('You can only move items you own');
const f0=its[0][0][0]=='f'?its[0][1]:D.FO.find(x=>x.id==its[0][1].fo),comp=f0.c,ban=new Set();
its.forEach(([k,it])=>{if(k[0]=='f')dsc(it.id).forEach(i=>ban.add(i))});
const allF=its.every(x=>x[0][0]=='f'),official=its.some(x=>!x[1].own),root=allF&&(role=='admin'||!official);
const opts=[...(root?[['','Component root']]:[]),...D.FO.filter(f=>f.c==comp&&!ban.has(f.id)&&(!official||!f.own)).map(f=>[f.id,fpath(f)]).sort((a,b)=>cmp(a[1],b[1]))];
if(!opts.length)return toast('There is nowhere to move these items');
openMdl({title:'Move '+its.length+' item(s)',okText:'Move',body:`<div class="field"><label>Destination (${comp})</label>${dd('mvTo',opts,opts[0][0])}</div>`,onOk:async()=>{const to=v('mvTo');let n=0;

toast('Moved '+n+' item(s)');selOff(1);route()}})}

/* ===== COPY, DUPLICATE, PASTE ===== */
async function cloneFile(m,dest,title){const off=role=='admin'&&!dest.own,np=`${off?'official':ME.id}/${dest.id}/${Date.now()}_${U()}_${(title+'.'+m.type.toLowerCase()).replace(/[^a-zA-Z0-9._-]/g,'_')}`;
const c=await sb.storage.from('review-materials').copy(m.path,np);if(c.error)throw c.error;
const r=await sb.from('materials').insert({folder_id:dest.id,title,description:m.desc,file_type:m.type,file_path:np,published:true,owner_id:off?null:ME.id}).select().single();
if(r.error){await sb.storage.from('review-materials').remove([np]);throw r.error}D.M.push(mapM(r.data))}
async function cloneFo(f,par,name,comp){const mine=role!='admin'||(par&&par.own),r=await sb.from('folders').insert({component:comp,name,parent_id:par?par.id:null,owner_id:mine?ME.id:null}).select().single();if(r.error)throw r.error;
const nf=mapFo(r.data);D.FO.push(nf);const kids=D.FO.filter(x=>x.parent==f.id&&x.id!=nf.id);
for(const m of D.M.filter(x=>x.fo==f.id&&x.path))await cloneFile(m,nf,m.title);for(const s of kids)await cloneFo(s,nf,s.name,comp);return nf}
async function pasteHere(destId,comp){if(PASTING||!CB||!CB.keys.length)return;const cb=CB;PASTING=1;CB=null;
try{const dest=destId?D.FO.find(x=>x.id==destId):null,c=dest?dest.c:comp;
if(cb.cut){const ch=moveCheck(cb.keys.filter(x=>gi(x)),destId||'',c);if(!ch.ok)toast(ch.err);else toast('Moved '+await moveTo(ch.its,destId||'')+' item(s)');selOff(1)}
else{let ok=0,bad=0;toast('Pasting…');
for(const k of cb.keys){const it=gi(k);if(!it){bad++;continue}try{
if(k[0]=='m'){if(!dest){bad++;continue}await cloneFile(it,dest,uname(it.title,sibNames(dest.id,'m')))}
else{if(dest&&dsc(it.id).includes(dest.id)){bad++;continue}await cloneFo(it,dest,uname(it.name,sibNames(dest?dest.id:null,'f',c)),c)}ok++}catch(e){bad++;toast(e.message||String(e))}}
toast('Pasted '+ok+' item(s)'+(bad?', '+bad+' skipped (files can only be pasted inside a folder)':''))}}
finally{PASTING=0}
route()}
async function dupKey(k){const it=gi(k);if(!it)return;toast('Duplicating…');try{
if(k[0]=='m'){const fo=D.FO.find(x=>x.id==it.fo);await cloneFile(it,fo,uname(it.title,sibNames(fo.id,'m')))}
else{const par=it.parent?D.FO.find(x=>x.id==it.parent):null;await cloneFo(it,par,uname(it.name,sibNames(it.parent,'f',it.c)),it.c)}toast('Duplicated')}catch(e){toast(e.message||String(e))}route()}
const copyKey=k=>{CB={keys:[k],cut:false};toast('Copied. Open a folder and press Paste.');route()};

function cardOpen(k){if(Date.now()-lastOpen<700)return;lastOpen=Date.now();const it=gi(k);if(!it)return;k[0]=='f'?go('f/'+it.id):openM(it.id)}

function rangeSel(k){const a=VIS.indexOf(ANCH||ACT||k),b=VIS.indexOf(k);if(a<0||b<0)return setActive(k);SEL=new Set(VIS.slice(Math.min(a,b),Math.max(a,b)+1));selMode=true;ACT=k;route()}

if(selMode){e.shiftKey?rangeSel(k):selTog(k);return}
if(e.shiftKey&&PCM()){rangeSel(k);return}
if((e.ctrlKey||e.metaKey)&&PCM()){selMode=true;SEL.has(k)?SEL.delete(k):SEL.add(k);ACT=k;ANCH=k;route();return}

if(e.target.closest('.nm')){cardOpen(k);return}
setActive(k)}

document.addEventListener('click',e=>{if(ACT&&!e.target.closest('.fr,.selbar,.btn,.pop,.custom-dropdown,#mdlRoot,.fm-backdrop,.sb,.vwin')){ACT='';document.querySelectorAll('.fr.active').forEach(x=>x.classList.remove('active'));renderSidebar()}});

/* ===== KEYBOARD SHORTCUTS (folders and files; no extra buttons) =====
 Ctrl/Cmd+A select all · C copy · X cut · V paste · D duplicate · Delete (or Cmd+Backspace) delete · F2 rename · Enter open
 Arrows move · Shift+Arrows extend selection · Space toggle · Home/End · Esc clear · Backspace go up one folder */
const curKeys=()=>SEL.size?selKeys():(ACT&&gi(ACT)?[ACT]:[]);
const gridCols=()=>{const c=[...document.querySelectorAll('.fr[data-k]')];if(c.length<2||!document.querySelector('.g.grid'))return 1;const t=c[0].offsetTop;let n=0;for(const x of c){if(x.offsetTop!==t)break;n++}return Math.max(n,1)};
function kbMove(key,shift){if(!VIS.length)return;const cols=gridCols();let i=VIS.indexOf(ACT);
if(key=='Home')i=0;else if(key=='End')i=VIS.length-1;else if(i<0)i=0;
else i=Math.max(0,Math.min(VIS.length-1,i+(key=='ArrowRight'?1:key=='ArrowLeft'?-1:key=='ArrowDown'?cols:-cols)));
const k=VIS[i];if(shift){const a=VIS.indexOf(ANCH||ACT||k);SEL=new Set(VIS.slice(Math.min(a,i),Math.max(a,i)+1));selMode=true;ACT=k;route();const el=[...document.querySelectorAll('.fr[data-k]')].find(x=>x.dataset.k==k);el&&el.scrollIntoView({block:'nearest'})}
else{setActive(k,true)}}
addEventListener('keydown',e=>{if(MD||e.defaultPrevented||!ME)return;const t=e.target;
if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable))return;
const p=location.hash.slice(2).split('/');if(p[0]!='c'&&p[0]!='f')return;
const mod=e.ctrlKey||e.metaKey,key=e.key,lk=key.length==1?key.toLowerCase():key,btn=t&&/BUTTON|A/.test(t.tagName);
const here=p[0]=='f'?p[1]:'',comp=p[0]=='f'?(D.FO.find(x=>x.id==p[1])||{}).c:p[1];
if(mod&&lk=='a'){e.preventDefault();selMode=true;SEL=new Set(VIS);route();return}
if(mod&&lk=='c'){if(String(getSelection())||!curKeys().length)return;e.preventDefault();const k=curKeys();CB={keys:k,cut:false};toast('Copied '+k.length+' item(s). Press Ctrl+V in a folder.');route();return}
if(mod&&lk=='x'){if(String(getSelection()))return;const k=curKeys();if(!k.length)return;e.preventDefault();const ok=k.filter(x=>x[0]=='f'?canFo(gi(x)):canMat(gi(x)));if(!ok.length)return toast('You can only cut items you own');CB={keys:ok,cut:true};toast('Cut '+ok.length+' item(s). Press Ctrl+V in the destination folder.');route();return}
if(mod&&lk=='v'){if(CB&&CB.keys.length){e.preventDefault();pasteHere(here,comp)}return}
if(mod&&lk=='d'){const k=curKeys();e.preventDefault();if(!k.length)return;(async()=>{for(const x of k)await dupKey(x)})();return}
if(key=='Delete'||(mod&&key=='Backspace')){const k=curKeys();if(!k.length)return;e.preventDefault();delKeys(k);return}
if(key=='F2'){const k=curKeys();if(k.length!=1)return;e.preventDefault();const it=gi(k[0]);if(k[0][0]=='f'){if(canFo(it))renameFolder(it.id)}else if(canMat(it))renameMaterial(it.id);return}
if(key=='Enter'&&!btn){const k=curKeys();if(k.length==1){e.preventDefault();cardOpen(k[0])}return}

function startQ(){const p=pool();if(p.length<10)return toast('At least 10 questions are needed. Select more subjects or topics.');const n=Math.min(Math.max(10,QS.n|0),p.length),
allS=msItems('s').every(i=>QS.subj.has(i.k)),allT=msItems('t').every(i=>QS.top.has(i.k)),
qs=sh(p).slice(0,n).map(x=>{const o=sh(x.o.map((t,i)=>[t,i]));return{...x,o:o.map(a=>a[0]),a:o.findIndex(a=>a[1]==x.a)}});
QZ={qs,sel:{},t0:Date.now(),end:QS.t>0?Date.now()+QS.t*60000:0,scope:(QS.c||'All components')+' · '+(allS?'all subjects':QS.subj.size+' subjects')+(allT?'':' · '+QS.top.size+' topics')+(QS.src=='own'?' · my questions':QS.src=='off'?' · official':''),done:0,nt:{}};route();scrollTo(0,0)}
function tick(){const e=$('#tm');if(!QZ||QZ.done||!e)return;const s=Math.max(0,Math.round((QZ.end-Date.now())/1000));e.textContent='⏱ '+mmss(s);e.classList.toggle('low',s<60);if(!s)return submitQ(1);tk=setTimeout(tick,500)}

const it=z.qs.map((q,i)=>{const ok=+(z.sel[i]===q.a);sc+=ok;const s=P.q[q.id]||[0,0,0];P.q[q.id]=[s[0]+ok,s[1]+1,ok];return{id:q.id,ch:z.sel[i]==null?null:q.o[z.sel[i]],ok}});
z.sc=sc;z.it=it;z.secs=Math.round((Date.now()-z.t0)/1000);const nq={};z.qs.forEach((q,i)=>{const t=((z.nt||{})[i]||'').trim();if(t)nq[q.id]=t});const nts=Object.keys(nq).length?JSON.stringify({v:2,q:nq}):'';P.h.unshift({id:U(),ts:Date.now(),sc:z.scope,n:z.qs.length,k:sc,secs:z.secs,notes:nts,it});route();scrollTo(0,0);
sb.from('quiz_attempts').insert({user_id:ME.id,scope:z.scope,total:z.qs.length,correct:sc,seconds:z.secs,...(nts?{notes:nts}:{})}).select().single().then(async r=>{if(r.error)return toast('Could not save history: '+r.error.message);P.h[0].id=r.data.id;const a=await sb.from('quiz_answers').insert(it.map((i,n)=>({attempt_id:r.data.id,user_id:ME.id,question_id:i.id,chosen:i.ch,is_correct:!!i.ok,position:n})));if(a.error)toast('Could not save answers: '+a.error.message)})}

/* ===== HISTORY ===== */
let HV=null,HI=0,HW=0;
function histNotes(x){const o=pNotes(x.notes),pr='<p style="white-space:pre-wrap;margin-top:6px">';let b='';
if(o.l)b=pr+E(o.l)+'</p>';else if(o.q)b=x.it.map((i,n)=>o.q[i.id]?pr+'<b>Q'+(n+1)+'.</b> '+E(o.q[i.id])+'</p>':'').join('');
return b?'<details class="sm"><summary>Notes</summary>'+b+'</details>':''}
/* a card face: text on the left, picture (if any) on the right. fitCards() shrinks the text so everything fits. */
const face=(t,img)=>{const has=String(t||'').replace(/<[^>]*>/g,'').trim().length>0,im=img?`<div class="fimgw"><img src="${img}" alt="" draggable="false"></div>`:'';
return `<div class="fcont ${img?(has?'both':'imgonly'):'noimg'}">${has||!img?`<div class="ftxt">${t}</div>`:''}${im}</div>`};
const flip=(f,b,sw,n)=>`<div class="fcw"><div class="fc" data-sw="${sw||''}" data-n="${n||0}"><div class="fi"><div class="ff">${f}</div><div class="fb">${b}</div></div></div></div>`;
function replay(h){const l=h.it.map(i=>({i,q:allQ().find(x=>x.id==i.id)})).filter(x=>x.q&&(!HW||!x.i.ok)),
bk=`<div class="row" style="margin:0 0 12px"><button class="btn" onclick="HV=null;route()">← History</button><label class="sm"><input type="checkbox" ${HW?'checked':''} onchange="HW=this.checked?1:0;HI=0;route()"> Wrong answers only</label></div>`;
const o=pNotes(h.notes),lg=o.l?`<details class="sm" style="margin:0 0 12px"><summary>Quiz notes</summary><p style="white-space:pre-wrap;margin-top:6px">${E(o.l)}</p></details>`:'';
if(!l.length)return bk+lg+empty('Nothing to show.');HI=Math.min(HI,l.length-1);const{i,q}=l[HI],n=l.length,nn=o.q&&o.q[i.id]?`<div class="qnote" style="max-width:680px;margin:0 auto 14px">${E(o.q[i.id])}</div>`:'';
return bk+lg+flip(face(`${E(q.q)}<div class="fopts">${q.o.map((o,j)=>'ABCD'[j]+'. '+E(o)).join('<br>')}</div>`,q.qi),face(`<b>${i.ok?'✓ You were correct':'✗ You were wrong'}</b><p>Your answer: ${i.ch==null?'(none)':E(i.ch)}</p><p>Correct: ${E(q.o[q.a])}</p><p class="fopts">${E(q.e)}</p>`,q.ei),'replay',n)+nn+`<p class="mu sm" style="text-align:center">Question ${HI+1} of ${n} · tap to flip · swipe for the next one</p><div class="row" style="justify-content:center"><button class="btn" onclick="HI=(HI+${n-1})%${n};route()">←</button><button class="btn" onclick="HI=(HI+1)%${n};route()">→</button></div>`}
V.hist=()=>{const h=P.h.find(x=>x.id==HV),dt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),tm=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
return hd('Quiz History','Every quiz you finish is saved here, with your notes. Green = correct, red = wrong.')+`<div class="w sec">${h?replay(h):`<div class="stack">${P.h.map(x=>`<div class="card"><div class="hrow"><div class="hl"><b>${dt(x.ts)}</b><span class="mu sm">${tm(x.ts)}</span><span class="mu sm">⏱ ${mmss(x.secs)} taken</span></div><div class="hr"><span class="hscore">${x.k} / ${x.n} <small class="mu">${Math.round(100*x.k/x.n)}%</small></span><button class="btn p" onclick="HV='${x.id}';HI=0;HW=0;route()">Review as flashcards</button><span class="tag">${E(x.sc)}</span></div></div><div class="strip">${x.it.map(i=>`<i class="${i.ok?'g':''}"></i>`).join('')}</div>${histNotes(x)}</div>`).join('')||empty('No quizzes taken yet.')}</div>`}</div>`};

if(!d.length)return bar+empty(k[0]=='q'?'No questions match this selection.':'No cards here yet. Add your own under My Cards.');

async function saveCard(x,off){const f=v('ceF').trim(),b=v('ceB').trim();const rmF=!!($('#ceFIR')&&$('#ceFIR').checked),rmB=!!($('#ceBIR')&&$('#ceBIR').checked);

function imgBlob(f){return new Promise((res,rej)=>{if(!f)return res(null);const r=new FileReader();r.onerror=()=>rej(new Error('Could not read that image'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new Error('That file is not a readable image'));
i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Image conversion failed')),'image/jpeg',.85)};i.src=r.result};r.readAsDataURL(f)})}
async function putImg(blob,off){if(!blob)return '';const p=(off?'official':ME.id)+'/'+crypto.randomUUID()+'.jpg',u=await sb.storage.from('flashcard-images').upload(p,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;return p}
async function sUrl(p){if(!p)return '';const s=await sb.storage.from('flashcard-images').createSignedUrl(p,3600);return s.data?s.data.signedUrl:''}
const imgField=(id,label,cur)=>`<div class="field"><label>${label}</label><div class="dz" tabindex="0"><span class="dzn">Drop or paste an image here, or</span><br><input type="file" id="${id}" accept="image/*" onchange="this.parentNode.querySelector('.dzn').textContent='✓ '+(this.files[0]?this.files[0].name:'')"></div>${cur?`<div class="row" style="margin:6px 0 0"><img src="${cur}" alt="" style="height:54px;border-radius:4px;border:1px solid var(--bd)"><label class="sm"><input type="checkbox" id="${id}R"> Remove current image</label></div>`:''}</div>`;

async function saveQ(x,off){const o=[0,1,2,3].map(i=>v('qeO'+i).trim()),q=v('qeQ').trim(),s=v('qeS').trim(),t=v('qeT').trim();if(!q||!s||!t||o.some(z=>!z)){toast('Fill in subject, topic, question and all 4 choices');return false}

async function dupQ(id){const x=fq(id);if(!x)return;const r=await sb.from('questions').insert({component:x.c,subject:x.s,topic:x.t,question:x.q,choice_a:x.o[0],choice_b:x.o[1],choice_c:x.o[2],choice_d:x.o[3],correct_answer:'ABCD'[x.a],explanation:x.e,difficulty:x.d,source:x.src||null,verification_status:x.st||null,published:true,question_image:x.qp||null,explanation_image:x.ep||null,owner_id:x.own?ME.id:null}).select().single();

const walk=(src,dst)=>{src.childNodes.forEach(n=>{if(n.nodeType==3){dst.appendChild(document.createTextNode(n.nodeValue));return}if(n.nodeType!=1)return;const tg=n.tagName;

const e=document.createElement(k);if(k=='br'){dst.appendChild(e);return}
if(k=='div'&&n.dataset&&(n.dataset.cb=='0'||n.dataset.cb=='1'))e.dataset.cb=n.dataset.cb;
if(k=='a'){const h=n.getAttribute('href')||'';if(/^(https?:|mailto:)/i.test(h)){e.setAttribute('href',h);e.setAttribute('target','_blank');e.setAttribute('rel','noopener noreferrer')}}

function emoClose(){const p=$('#emoPick');if(p)p.remove();EMO.open=0}
function emoOpen(btn,mode){if(EMO.open&&EMO.btn===btn){emoClose();return}EMO.mode=mode;EMO.btn=btn;EMO.q='';
EMO.t=mode=='icon'?null:(btn.closest('.an-edw')?btn.closest('.an-edw').querySelector('.an-ed'):btn.closest('.an-inrow').querySelector('input'));
if(EMO.t&&EMO.t.classList.contains('an-ed')){annSaveRng(EMO.t)}
if(mode=='icon'&&EMO.tab=='badges')EMO.tab='icons';EMO.open=1;emoDraw(1)}
function emoDraw(place){let p=$('#emoPick');if(!p){p=document.createElement('div');p.id='emoPick';p.className='emo';p.setAttribute('onmousedown',"if(!event.target.closest('input'))event.preventDefault()");p.setAttribute('onclick','event.stopPropagation()');document.body.appendChild(p)}
const q=EMO.q.trim().toLowerCase(),tabs=[['icons','Icons'],['emoji','Emoji']].concat(EMO.mode=='icon'?[]:[['badges','Badges']]);let body='',cats='',note='';
if(EMO.tab=='icons'){const ks=Object.keys(ICP).filter(k=>!ICHIDE.includes(k)&&(!q||k.includes(q)||(ICN[k]||'').includes(q)));body=`<div class="emo-g">${ks.map(k=>`<button type="button" title="${E((ICN[k]||k).split(' ')[0])}" onclick="emoPick('i','${k}')">${ico(k)}</button>`).join('')||'<p class="mu sm" style="grid-column:1/-1;padding:10px">Nothing found.</p>'}</div>`;note='Site-style line icons (work in the body text)'}
else if(EMO.tab=='badges'){body=`<div class="emo-g bd">${Object.entries(ABD).map(([k,l])=>`<button type="button" onclick="emoPick('b','${k}')"><span class="abdg" data-b="${k}">${l}</span></button>`).join('')}</div>`;note='Colored labels for the body text'}
else{const list=q?EMOALL.flatMap(c=>c[2]).filter(([e,k])=>k.toLowerCase().includes(q)||e==q):(EMOALL[EMO.cat]||EMOALL[0])[2];
if(!q)cats=`<div class="emo-c">${EMOALL.map((c,i)=>`<button type="button" class="${i==EMO.cat?'on':''}" title="${E(c[0])}" onclick="EMO.cat=${i};emoDraw()">${c[1]}</button>`).join('')}</div>`;
body=`<div class="emo-g">${list.map(([e,k])=>`<button type="button" title="${E(k)}" onclick="emoPick('e','${e}')">${e}</button>`).join('')||'<p class="mu sm" style="grid-column:1/-1;padding:10px">Nothing found.</p>'}</div>`;note=q?'Search results':(EMOALL[EMO.cat]||EMOALL[0])[0]}
p.innerHTML=`<div class="emo-h"><input placeholder="Search icons, emoji, badges…" value="${E(EMO.q)}" oninput="EMO.q=this.value;emoDraw();const i=document.querySelector('#emoPick input');i.focus();i.setSelectionRange(99,99)"><button type="button" class="vbt x" onclick="emoClose()" title="Close">${ico('x')}</button></div><div class="emo-t">${tabs.map(([k,n])=>`<button type="button" class="${EMO.tab==k?'on':''}" onclick="EMO.tab='${k}';EMO.q='';emoDraw()">${n}</button>`).join('')}</div>${cats}<div class="emo-n">${E(note)}</div>${body}`;
if(place&&EMO.btn){const r=EMO.btn.getBoundingClientRect(),w=Math.min(344,innerWidth-12);p.style.left=Math.max(6,Math.min(r.left,innerWidth-w-6))+'px';const h=p.offsetHeight||380;p.style.top=(r.bottom+6+h>innerHeight&&r.top-h-6>0?r.top-h-6:Math.max(6,Math.min(r.bottom+6,innerHeight-h-6)))+'px'}}
function emoPick(kind,val){
if(EMO.mode=='icon'){ANF.s.icon=val;emoClose();route();return}
const t=EMO.t;if(!t||!document.contains(t))return toast('Click into a field first');
if(t.tagName=='INPUT'){if(kind!='e')return toast('Icons and badges work in the body text. Pick an emoji for this field.');const a=t.selectionStart==null?t.value.length:t.selectionStart,b=t.selectionEnd==null?a:t.selectionEnd;t.setRangeText(val,a,b,'end');t.focus();t.dispatchEvent(new Event('input'));return}
t.focus();annRestore(t);
if(kind=='e')document.execCommand('insertText',false,val);
else if(kind=='i')document.execCommand('insertHTML',false,`<span class="aic" data-i="${val}" contenteditable="false">${ico(val)}</span>&nbsp;`);
else document.execCommand('insertHTML',false,`<span class="abdg" data-b="${val}" contenteditable="false">${ABD[val]}</span>&nbsp;`);
annEdInput(t);annSaveRng(t)}
document.addEventListener('click',e=>{if(EMO.open&&!e.target.closest('.emo,.an-emobtn'))emoClose()});

/* session: runs on page load, login, logout and password-reset links */
sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
if(ev=='PASSWORD_RECOVERY')AU.mode='newpw';
const u=s&&s.user||null;
/* Coming back to the tab makes Supabase re-send SIGNED_IN / TOKEN_REFRESHED for the same user. Nothing changed, so do not redraw the page. */
if(u&&ME&&CU==u.id&&ev!='PASSWORD_RECOVERY'&&ev!='USER_UPDATED'){ME=u;return}
ME=u;
if(!ME){if(PCH){try{sb.removeChannel(PCH)}catch(e){}PCH=null}ONL={};CU=null;D={FO:[],M:[],F:[],MQ:[],U:[]};P={h:[],q:{},fc:{},bm:[],op:{}};OQ=[];PR=null;role='student';QZ=null;QL=1;VWS=[];ntReset();renderFileViewer();ANN_AUTO=0;ANNR=new Set();annClose(1);
if(ev=='SIGNED_OUT'){const own=USER_OUT;USER_OUT=0;go('home');if(!own)toast('You were signed out (session ended or you signed out on another device or tab). Please sign in again.')}else route();return}
if(ME.id!=CU){CU=ME.id;ntReset();ANN_AUTO=0;ANNR=new Set();QL=0;route();await load();QL=1}
if(AU.mode=='newpw')go('auth');else if(location.hash=='#/auth')go('dash');else route()},0));
route=(f=>function(){f();placeCtx();annAfterRoute()})(route);syncTheme();annLoad().then(()=>{if(!ME&&QL&&(location.hash.slice(2)||'home').split('/')[0]=='home')route()});route();
/* PWA: lets the app install on PC and phones and open its shell offline */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)));
</script>
